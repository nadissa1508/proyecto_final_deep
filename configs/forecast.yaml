# Datos y evaluación del pronóstico climático. Todos los scripts de src/forecast leen de aquí.
# Split temporal (nunca aleatorio): lo que se evalúa es siempre posterior a lo que se entrena.
split:
  train_end: "2017-12-31"
  val_end: "2020-12-31"      # val: 2018-2020; test: 2021-01-01 en adelante
input_days: 90               # ventana de historia que ve el modelo
horizons: [1, 3, 7, 14]      # horizontes que se reportan (el modelo predice los 14 días)
max_horizon: 14
targets: [temperature_2m_mean, relative_humidity_2m_mean, precipitation_sum]
seasonal_window_days: 7      # el baseline estacional promedia ±7 días alrededor del día del año

# Evaluación contra las estaciones de ANACAFE (datos medidos, 2022 en adelante). Fechas del día OBJETIVO.
stations:
  adjust_start: "2022-01-01"   # periodo para ajustar sesgos y afinar el modelo...
  adjust_end: "2024-12-31"     # ...termina aquí
  val_end: "2025-06-30"        # 2025-01 a 2025-06: validación del afinado
  test_start: "2025-07-01"     # test: desde aquí (jul-2025 a oct-2026, ~16 meses); nunca se usa para ajustar
