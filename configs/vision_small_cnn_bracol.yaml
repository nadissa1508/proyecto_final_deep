# Corrida de visión: Baseline: CNN pequeña desde cero, BRACOL
name: small_cnn_bracol
model: small_cnn                 # resnet18 | efficientnet_b0 | small_cnn
strategy: scratch   # feature_extraction | partial | full_dlr | scratch
train_on: bracol                # bracol | rocole | both
img_size: 256
batch_size: 32
epochs: 25
patience: 5
lr: 1.0e-3                      # cabeza (o todo, en scratch)
weight_decay: 0.01
class_weights: true             # pesos inversos a la frecuencia de cada clase en train
amp: true
num_workers: 4
seed: 42
