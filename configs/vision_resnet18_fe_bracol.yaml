# Corrida de visión: ResNet-18, solo cabeza (feature extraction), entrenado con BRACOL
name: resnet18_fe_bracol
model: resnet18                 # resnet18 | efficientnet_b0 | small_cnn
strategy: feature_extraction   # feature_extraction | partial | full_dlr | scratch
train_on: bracol                # bracol | rocole | both
img_size: 256
batch_size: 32
epochs: 15
patience: 5
lr: 1.0e-3                      # cabeza (o todo, en scratch)
weight_decay: 0.01
class_weights: true             # pesos inversos a la frecuencia de cada clase en train
amp: true
num_workers: 4
seed: 42
